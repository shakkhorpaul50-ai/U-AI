services:
  - type: web
    name: u-ai-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: Model__Path
        value: /app/model
      - key: Model__Threads
        value: "1"
